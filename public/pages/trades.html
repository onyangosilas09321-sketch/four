<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trades</title><script src="https://cdn.tailwindcss.com"></script><!-- Database: Supabase + IndexedDB (no Parse Server) --><link rel="stylesheet" href="/css/custom.css"></head><body class="bg-neutral-50 text-neutral-900"><header class="bg-white border-b"><nav class="container mx-auto px-4 h-16 flex items-center gap-6"><a href="/" class="font-semibold">Four Hands</a><a href="/" class="hover:underline">Dashboard</a><a href="/pages/trades.html" class="font-medium">Trades</a><a href="/pages/ml.html" class="hover:underline">ML</a><a href="/pages/settings.html" class="hover:underline">Settings</a></nav></header><main class="container mx-auto px-4 py-10 space-y-6"><section class="grid grid-cols-1 md:grid-cols-4 gap-4"><div><label class="text-sm">Date Range</label><select id="date-filter" class="w-full h-11 rounded-xl border px-3"><option value="today">Today</option><option value="week">Last 7 Days</option><option value="month" selected>Last 30 Days</option><option value="all">All Time</option></select></div><div><label class="text-sm">Type</label><select id="type-filter" class="w-full h-11 rounded-xl border px-3"><option value="all">All</option><option value="CALL">CALL</option><option value="PUT">PUT</option></select></div><div><label class="text-sm">Result</label><select id="result-filter" class="w-full h-11 rounded-xl border px-3"><option value="all">All</option><option value="win">Wins</option><option value="loss">Losses</option></select></div><div class="flex items-end"><button id="apply-filters" class="h-11 w-full rounded-xl bg-neutral-900 text-white">Apply</button></div></section><section class="rounded-2xl border bg-white p-5"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-neutral-600"><th class="py-2">Date/Time</th><th>Trade ID</th><th>Type</th><th>Stake</th><th>Duration</th><th>Buy</th><th>Sell</th><th>P&L</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="trades-tbody"><tr><td colspan="10" class="text-center py-6 text-neutral-500">Loading...</td></tr></tbody></table></div></section></main><script src="/js/app.js"></script><script src="/js/api.js"></script><script src="/js/ui.js"></script><script>let currentFilters={dateRange:'month',type:'all',result:'all'};document.addEventListener('DOMContentLoaded',async()=>{document.getElementById('apply-filters').onclick=loadTrades;loadTrades();});async function loadTrades(){currentFilters={dateRange:document.getElementById('date-filter').value,type:document.getElementById('type-filter').value,result:document.getElementById('result-filter').value};const res=await API.listTrades({limit:1000,filters:currentFilters});const tb=document.getElementById('trades-tbody');if(!res.success||!res.data.length){tb.innerHTML='<tr><td colspan="10" class="text-center py-6 text-neutral-500">No trades</td></tr>';return;}tb.innerHTML=res.data.map(t=>`<tr class='border-t'><td class='py-2'>${new Date((t.timestamp||0)*1000).toLocaleString()}</td><td><code>${(t.trade_id||'').toString().slice(0,8)}</code></td><td>${t.contract_type||''}</td><td>$${(t.stake||0).toFixed(2)}</td><td>${t.duration||0} ${t.duration_unit||'t'}</td><td>${t.buy_price?('$'+t.buy_price.toFixed(2)):'N/A'}</td><td>${t.sell_price?('$'+t.sell_price.toFixed(2)):'N/A'}</td><td class='${(t.pnl||0)>=0?'text-emerald-600':'text-red-600'} font-medium'>${(t.pnl||0)>=0?'+':''}$${(t.pnl||0).toFixed(2)}</td><td>${t.prediction_confidence?Math.round(t.prediction_confidence*100)+'%':'N/A'}</td><td>${t.status||''}</td></tr>`).join('');}</script></body></html>

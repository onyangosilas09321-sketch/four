<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/parse@6.1.1/dist/parse.min.js"></script><script>Parse.initialize('61rFcyb3ekS16wLu1CvZE1CRVRFRtFx4vXiDtSu7','Wtn21iCjq808ZOen9yO2P1IH7Rzf6kahhcspUWWS'); Parse.serverURL='https://parseapi.back4app.com';</script></head><body class="bg-neutral-50 text-neutral-900"><header class="bg-white border-b"><nav class="container mx-auto px-4 h-16 flex items-center gap-6"><a href="/" class="font-semibold">Four Hands</a><a href="/" class="hover:underline">Dashboard</a><a href="/pages/trades.html" class="hover:underline">Trades</a><a href="/pages/ml.html" class="hover:underline">ML</a><a href="/pages/settings.html" class="font-medium">Settings</a></nav></header><main class="container mx-auto px-4 py-10 space-y-6"><section class="rounded-2xl border bg-white p-5"><h3 class="text-lg font-semibold mb-4">Deriv</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="text-sm">Deriv App ID</label><input id="derivAppId" type="text" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Note</label><p class="text-sm text-neutral-600">Your API Token is not saved; enter it on the Dashboard header.</p></div></div></section><section class="rounded-2xl border bg-white p-5"><h3 class="text-lg font-semibold mb-4">Trading</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="text-sm">Base Stake</label><input id="baseStake" type="number" class="w-full h-11 rounded-xl border px-3" step="0.1"/></div><div><label class="text-sm">Min Stake</label><input id="minStake" type="number" class="w-full h-11 rounded-xl border px-3" step="0.1"/></div><div><label class="text-sm">Max Stake</label><input id="maxStake" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Duration</label><input id="duration" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Duration Unit</label><select id="durationUnit" class="w-full h-11 rounded-xl border px-3"><option value="t">Ticks</option><option value="s">Seconds</option><option value="m">Minutes</option><option value="h">Hours</option></select></div><div><label class="text-sm">Max Trades/Day</label><input id="maxTradesDay" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Max Open Positions</label><input id="maxOpenPositions" type="number" class="w-full h-11 rounded-xl border px-3"/></div></div></section><section class="rounded-2xl border bg-white p-5"><h3 class="text-lg font-semibold mb-4">Risk</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="text-sm">Max Daily Loss</label><input id="maxDailyLoss" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Max Drawdown %</label><input id="maxDrawdown" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Kelly Fraction</label><input id="kellyFraction" type="number" class="w-full h-11 rounded-xl border px-3" step="0.01"/></div><div><label class="text-sm">Consecutive Loss Limit</label><input id="consecutiveLossLimit" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div class="flex items-center gap-2"><input id="reduceStakeOnLoss" type="checkbox"/><label class="text-sm">Reduce Stake On Loss</label></div><div class="flex items-center gap-2"><input id="useStopLoss" type="checkbox"/><label class="text-sm">Use Stop Loss</label></div><div class="flex items-center gap-2"><input id="useTakeProfit" type="checkbox"/><label class="text-sm">Use Take Profit</label></div></div></section><section class="rounded-2xl border bg-white p-5"><h3 class="text-lg font-semibold mb-4">Machine Learning</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="text-sm">Confidence Threshold</label><input id="confidenceThreshold" type="number" class="w-full h-11 rounded-xl border px-3" step="0.01"/></div><div><label class="text-sm">Min Edge</label><input id="minEdge" type="number" class="w-full h-11 rounded-xl border px-3" step="0.01"/></div><div><label class="text-sm">Training Interval (hours)</label><input id="trainingIntervalHours" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div><label class="text-sm">Min Training Samples</label><input id="minTrainingSamples" type="number" class="w-full h-11 rounded-xl border px-3"/></div><div class="flex items-center gap-2"><input id="onlineLearning" type="checkbox"/><label class="text-sm">Enable Online Learning</label></div></div></section><section class="rounded-2xl border bg-white p-5"><div class="flex justify-end gap-3"><button id="saveSettings" class="h-11 px-6 rounded-xl bg-neutral-900 text-white">Save Settings</button></div></section></main><script src="/js/api.js"></script><script src="/js/ui.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await load();document.getElementById('saveSettings').onclick=save;});async function load(){const res=await API.getSettings();if(!res.success) return UI.toast('Failed to load settings','danger');const s=res.data;const numeric=['baseStake','minStake','maxStake','duration','durationUnit','maxTradesDay','maxOpenPositions','maxDailyLoss','maxDrawdown','kellyFraction','consecutiveLossLimit','confidenceThreshold','minEdge','trainingIntervalHours','minTrainingSamples'];for(const id of numeric){const el=document.getElementById(id); if(!el) continue; if(el.tagName==='SELECT') el.value=s[id]??el.value; else el.value=s[id]??el.value;}document.getElementById('reduceStakeOnLoss').checked=!!s.reduceStakeOnLoss;document.getElementById('useStopLoss').checked=!!s.useStopLoss;document.getElementById('useTakeProfit').checked=!!s.useTakeProfit;document.getElementById('onlineLearning').checked=!!s.onlineLearning;document.getElementById('derivAppId').value=s.derivAppId||'';}async function save(){const payload={};const numeric=['baseStake','minStake','maxStake','duration','maxTradesDay','maxOpenPositions','maxDailyLoss','maxDrawdown','kellyFraction','consecutiveLossLimit','confidenceThreshold','minEdge','trainingIntervalHours','minTrainingSamples'];for(const id of numeric){const el=document.getElementById(id); if(!el) continue; payload[id]=parseFloat(el.value);}payload.durationUnit=document.getElementById('durationUnit').value;payload.reduceStakeOnLoss=document.getElementById('reduceStakeOnLoss').checked;payload.useStopLoss=document.getElementById('useStopLoss').checked;payload.useTakeProfit=document.getElementById('useTakeProfit').checked;payload.onlineLearning=document.getElementById('onlineLearning').checked;payload.derivAppId=document.getElementById('derivAppId').value||'';const res=await API.saveSettings(payload);if(res.success) UI.toast('Settings saved','success'); else UI.toast('Failed to save','danger');}</script></body></html>

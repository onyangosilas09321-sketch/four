<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ML Analytics</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/parse@6.1.1/dist/parse.min.js"></script><script>Parse.initialize('61rFcyb3ekS16wLu1CvZE1CRVRFRtFx4vXiDtSu7','Wtn21iCjq808ZOen9yO2P1IH7Rzf6kahhcspUWWS'); Parse.serverURL='https://parseapi.back4app.com';</script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body class="bg-neutral-50 text-neutral-900"><header class="bg-white border-b"><nav class="container mx-auto px-4 h-16 flex items-center gap-6"><a href="/" class="font-semibold">Four Hands</a><a href="/" class="hover:underline">Dashboard</a><a href="/pages/trades.html" class="hover:underline">Trades</a><a href="/pages/ml.html" class="font-medium">ML</a><a href="/pages/settings.html" class="hover:underline">Settings</a></nav></header><main class="container mx-auto px-4 py-10 space-y-6"><section class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="rounded-2xl border bg-white p-5"><p class="text-sm text-neutral-600">Latest Model</p><h3 id="ml-version" class="text-2xl font-semibold">—</h3></div><div class="rounded-2xl border bg-white p-5"><p class="text-sm text-neutral-600">Trainable Samples</p><h3 id="ml-samples" class="text-2xl font-semibold">—</h3></div><div class="rounded-2xl border bg-white p-5"><p class="text-sm text-neutral-600">Recent Accuracy</p><h3 id="ml-acc" class="text-2xl font-semibold">—</h3></div><div class="rounded-2xl border bg-white p-5"><p class="text-sm text-neutral-600">Horizon</p><h3 id="ml-horizon" class="text-2xl font-semibold">5</h3></div></section><section class="rounded-2xl border bg-white p-5"><div class="flex flex-wrap gap-3 items-end"><div><label class="text-sm">Lookback</label><input id="lookback" type="number" class="w-40 h-11 rounded-xl border px-3" value="1000"/></div><div><label class="text-sm">Horizon (ticks)</label><input id="horizon" type="number" class="w-40 h-11 rounded-xl border px-3" value="5"/></div><button id="btnTrain" class="h-11 px-5 rounded-xl bg-neutral-900 text-white">Train Model</button></div></section><section class="rounded-2xl border bg-white p-5"><h3 class="text-lg font-semibold mb-4">Accuracy Over Time</h3><canvas id="accuracy-chart" height="120"></canvas></section></main><script src="/js/api.js"></script><script src="/js/ui.js"></script><script src="/js/charts.js"></script><script>let accChart;document.addEventListener('DOMContentLoaded',async()=>{await refresh();document.getElementById('btnTrain').onclick=async()=>{const lookback=parseInt(document.getElementById('lookback').value||'1000');const horizon=parseInt(document.getElementById('horizon').value||'5');try{const res=await API.trainModel({lookback,horizon});if(res.success){UI.toast('Model trained','success'); await refresh();}}catch(e){UI.toast('Training failed','danger');}};});async function refresh(){const m=await API.getModel();if(m.success){document.getElementById('ml-version').textContent=m.model.version; document.getElementById('ml-horizon').textContent=m.model.meta.horizon;}const acc=await API.mlAccuracy({hours:24});if(acc.success){document.getElementById('ml-acc').textContent=(acc.data.accuracy*100).toFixed(1)+'%';}const labels=Array.from({length:12}).map((_,i)=>`-${(12-i)*2}h`);const data=Array.from({length:12}).map(()=>acc.success?acc.data.accuracy:0); if(!accChart) accChart=Charts.simpleLine('accuracy-chart',data,labels); else {accChart.data.labels=labels; accChart.data.datasets[0].data=data; accChart.update();}const cnt = (await Parse.Cloud.run('listTrades',{limit:1})).data.length; document.getElementById('ml-samples').textContent = cnt>=0? 'OK' : '—';}</script></body></html>
